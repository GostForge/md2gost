name: md2gost CI

on:
  push:
    paths:
      - "md2gost/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "md2gost/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install system fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y multiverse
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends debconf-utils fontconfig cabextract wget xfonts-utils fontforge
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer
          wget -q https://gist.githubusercontent.com/maxwelleite/10774746/raw/ttf-vista-fonts-installer.sh -O /tmp/vista.sh
          sudo bash /tmp/vista.sh
          rm -f /tmp/vista.sh
          sudo fc-cache -f

      - name: Verify fonts
        run: |
          check_exact_font() {
            local family="$1"
            local resolved
            resolved="$(fc-match --format="%{family}\n" "${family}:weight=regular:slant=roman")"
            echo "${family} -> ${resolved}"
            if ! printf '%s' "${resolved}" | tr ',' '\n' | grep -Fxqi "${family}"; then
              echo "Required font '${family}' is not resolved exactly" >&2
              exit 1
            fi
          }

          check_exact_font "Times New Roman"
          check_exact_font "Courier New"
          check_exact_font "Calibri"
          check_exact_font "Consolas"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv

      - name: Run tests
        run: poetry run pytest -q
