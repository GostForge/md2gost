# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Example generator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core fonts-liberation2
        for pkg in fonts-crosextra-carlito fonts-crosextra-caladea; do
          if apt-cache show "$pkg" >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends "$pkg"
          else
            echo "Optional font package '$pkg' is unavailable; continuing"
          fi
        done
        sudo fc-cache -f
        python -m pip install --upgrade pip
        python -m venv venv
        source venv/bin/activate
        pip install .
    - name: Run
      run: |
        source venv/bin/activate
        python -m md2gost --syntax-highlighting examples/example.md
    - uses: actions/upload-artifact@v4
      with:
        name: example
        path: example.docx
