# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Example generator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends software-properties-common
        sudo add-apt-repository -y multiverse
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends debconf-utils fontconfig cabextract wget xfonts-utils fontforge
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer
        wget -q https://gist.githubusercontent.com/maxwelleite/10774746/raw/ttf-vista-fonts-installer.sh -O /tmp/vista.sh
        sudo bash /tmp/vista.sh
        rm -f /tmp/vista.sh
        sudo fc-cache -f
        for family in "Times New Roman" "Courier New" "Calibri" "Consolas"; do
          resolved="$(fc-match --format="%{family}\n" "${family}:weight=regular:slant=roman")"
          echo "${family} -> ${resolved}"
          if ! printf '%s' "${resolved}" | tr ',' '\n' | grep -Fxqi "${family}"; then
            echo "Required font '${family}' is not resolved exactly" >&2
            exit 1
          fi
        done
        python -m pip install --upgrade pip
        python -m venv venv
        source venv/bin/activate
        pip install .
    - name: Run
      run: |
        source venv/bin/activate
        python -m md2gost --syntax-highlighting examples/example.md
    - uses: actions/upload-artifact@v4
      with:
        name: example
        path: example.docx
